# nth config: copy to ~/.config/nth/config.toml (or $XDG_CONFIG_HOME/nth/config.toml).
# Every key is optional and shows its default. Keep only the ones you change.
# `nth config` prints the config nth actually uses.

[provider]
# Any OpenAI-compatible chat completions endpoint. --base-url / NTH_BASE_URL override it.
base_url = "https://opencode.ai/zen/go/v1"
# --model / NTH_MODEL override it.
model = "deepseek-v4.1-flash"
# Name of the environment variable that holds the API key. The key itself stays out of this file.
api_key_env = "OPENCODE_GO_API_KEY"

[session]
# Stop a turn after this many model requests without a final answer.
max_steps = 100

[mode]
# The mode a new chat starts in: "plan" or "act". Tab switches between them.
# `nth run` starts in act; `nth run --mode plan` plans instead.
default = "plan"

[mode.plan]
# Model and effort for plan mode. An empty model means the provider's model.
model = ""
# "default", "low", "medium" or "high".
effort = "default"

[mode.act]
model = ""
effort = "default"

[chat]
# Show the model's reasoning under its `∴ thought` line. /toggle-reasoning flips it until nth quits.
reasoning = true
# Show what each tool returned under its row. /toggle-tool-output flips it until nth quits.
tool_output = true

[tools.read]
# Lines returned when the model gives no limit.
default_limit = 2000
# Longer lines are cut.
max_line_chars = 2000
# Output stops before this many bytes.
max_bytes = 51200

[tools.bash]
# Timeout when the model gives none.
default_timeout_ms = 120000
# Cap on the timeout the model may ask for.
max_timeout_ms = 600000
# Longer output keeps only its last this-many characters.
max_output_chars = 30000

[tools.websearch]
# Exa's MCP endpoint. EXA_API_KEY, when set, is sent with each search.
url = "https://mcp.exa.ai/mcp"

[skills]
# Extra folders searched for SKILL.md files, after the standard ones.
# ~/ is the home directory; relative paths are from the working directory.
paths = []

[format]
# Run the file's formatters after a tool writes it. false turns them all off.
# `nth formatters` lists them and whether they apply to the working directory.
enabled = true

# One table per formatter to change or add. A built-in name (rustfmt, prettier,
# ruff, gofmt, ...) changes that formatter; any other name adds one, which needs
# command and extensions. $FILE is the file to format.
#
# [format.prettier]
# disabled = true
#
# [format.taplo]
# command = ["taplo", "format", "$FILE"]
# extensions = [".toml"]
# env = { RUST_LOG = "warn" }

[lsp]
# Start the file's language servers when a tool reads or writes it, and append
# the errors they report to the write result. false turns them all off.
# `nth lsp` lists them and the project root each would run in.
enabled = true

# One table per server to change or add. A built-in id (rust, typescript,
# pyright, gopls, clangd, ...) changes that server; any other id adds one, which
# needs command and extensions. initialization is sent as initializationOptions.
#
# [lsp.pyright]
# disabled = true
#
# [lsp.rust]
# command = ["ra-multiplex"]
#
# [lsp.my-server]
# command = ["my-server", "--stdio"]
# extensions = [".foo"]
# env = { RUST_LOG = "info" }
# initialization = { someOption = true }
