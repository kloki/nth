<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Isolation fixture</title>
    <style>
      body {
        margin: 24px;
        color: #173c26;
        background: #f1fff4;
        font: 18px/1.5 system-ui;
      }
      button,
      textarea,
      .toolbar {
        background: magenta !important;
        color: lime !important;
      }
      #summary {
        padding: 24px;
        background: white;
        border: 2px solid #173c26;
      }
      #scroller {
        height: 220px;
        overflow: auto;
        border: 2px solid;
        margin-top: 24px;
      }
      .spacer {
        height: 400px;
      }
      #nested {
        padding: 32px;
        background: #ddeeff;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Independent browser fixture</h1>
    <section id="summary">
      Summary target: remove this semantic ID in revision two.
    </section>
    <details id="more">
      <summary>More detail</summary>
      Opens only while comments are off.
    </details>
    <div id="scroller">
      <div class="spacer">Nested scrolling area</div>
      <section id="nested">Nested target</section>
      <div class="spacer"></div>
    </div>
    <div class="spacer">Document scrolling area</div>
    <section id="footer">Bottom target</section>
  </body>
</html>
