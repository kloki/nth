<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curios review</title>
    <link rel="stylesheet" href="/viewer.css" />
    <script src="/viewer.js" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <h1 id="title">Opening curio…</h1>
      <p id="notice" role="status" aria-live="polite" aria-atomic="true">
        Connecting…
      </p>
      <button id="comments" type="button" aria-pressed="true">
        Comments on
      </button>
      <div class="revision-controls">
        <label for="revision">Revision</label
        ><select id="revision" disabled></select
        ><button id="update" hidden>View latest</button>
      </div>
    </header>
    <main id="stage">
      <iframe
        id="document"
        title="Published curio"
        sandbox="allow-same-origin"
        referrerpolicy="no-referrer"
      ></iframe>
      <div id="overlays" aria-label="Comment pins">
        <div id="selection-box" hidden></div>
        <div id="pins"></div>
        <section id="popover" hidden aria-label="Comment">
          <ol id="messages" aria-label="Thread messages"></ol>
          <p id="working" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span id="working-text">nth is working…</span>
          </p>
          <form id="comment-form">
            <textarea
              id="comment-body"
              rows="3"
              maxlength="16000"
              aria-label="Comment"
              placeholder="Comment for nth… (Shift+Enter for a new line)"
            ></textarea>
            <div class="actions">
              <button type="submit" class="primary" id="submit">Comment</button
              ><button type="button" id="resolve" hidden></button
              ><button type="button" id="close">Close</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <noscript
      >The trusted Curios review shell needs JavaScript. Published documents do
      not execute JavaScript.</noscript
    >
  </body>
</html>
