<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Authorization failed · nth</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f8f8;
        --card: #fcfcfc;
        --text-strong: #171717;
        --text-base: #6f6f6f;
        --text-weak: #8f8f8f;
        --border-weak: #e5e5e5;
        --success: #2dba26;
        --error: #ed4831;
        --detail-bg: #fff8f6;
        --detail-border: #fdc3b7;
        --shadow: 0 16px 48px -6px rgba(0, 0, 0, 0.1), 0 6px 12px -2px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.06);
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101010;
          --card: #161616;
          --text-strong: rgba(255, 255, 255, 0.936);
          --text-base: rgba(255, 255, 255, 0.618);
          --text-weak: rgba(255, 255, 255, 0.422);
          --border-weak: #282828;
          --success: #12c905;
          --error: #fc533a;
          --detail-bg: #28110c;
          --detail-border: #6a1206;
          --shadow: 0 16px 48px -6px rgba(0, 0, 0, 0.55), 0 6px 12px -2px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text-base);
        font-family: var(--font-sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(100%, 28rem);
        padding: 2.25rem 2rem 1.75rem;
        background: var(--card);
        border: 1px solid var(--border-weak);
        border-radius: 14px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .brand { margin-bottom: 1.75rem; font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; color: var(--text-strong); }
      .icon { display: flex; justify-content: center; margin-bottom: 1.125rem; line-height: 0; }
      .success .icon { color: var(--success); }
      .error .icon { color: var(--error); }
      .headline { margin: 0; font-size: 1.1875rem; font-weight: 500; line-height: 1.3; letter-spacing: -0.012em; color: var(--text-strong); }
      .message { margin: 0.5rem 0 0; font-size: 0.9375rem; }
      .detail {
        margin: 1.25rem 0 0;
        padding: 0.75rem 0.875rem;
        text-align: left;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        line-height: 1.55;
        color: var(--text-strong);
        background: var(--detail-bg);
        border: 1px solid var(--detail-border);
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 9.5rem;
        overflow: auto;
      }
      .footnote { margin: 1.5rem 0 0; font-size: 0.8125rem; color: var(--text-weak); }
    </style>
  </head>
  <body>
    <main class="card error" role="status">
      <div class="brand">nth</div>
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="m9 9 6 6m0-6-6 6" /></svg></div>
      <h1 class="headline">Authorization failed</h1>
      <p class="message">nth couldn't finish connecting to ChatGPT.</p>
      <pre class="detail">{{detail}}</pre>
      <p class="footnote">Close this window and try again from nth.</p>
    </main>
  </body>
</html>
