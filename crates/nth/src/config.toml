# nth config, written by `nth init`.
#
# Every key is optional and shows its default, so keep only the ones you
# change. `nth config` prints the config nth actually uses. --config or
# NTH_CONFIG point nth at another file.
#
# Nothing is configured to talk to yet. To start a chat:
#   1. uncomment a provider below (or add your own),
#   2. export the environment variable its api_key_env names,
#   3. set model to one of its models (`nth models` lists them), or leave it
#      empty and nth picks one at random.

# The model to fall back on, as provider/model: the provider id picks the
# endpoint and the rest goes on the wire. A bare id goes to the provider
# this key names. It is what a profile with an empty model runs, and what
# both modes run when there are no profiles at all. --model or NTH_MODEL
# override it. Empty means none: an empty model anywhere gets one picked
# at random from `nth models`.
model = ""
# model = "opencode/deepseek-v4.1-flash"

# Providers: one [provider.<id>] block per endpoint, and none are built in.
# The id prefixes its models, as in opencode/kimi-k3. Each is an
# OpenAI-compatible chat completions endpoint; models.dev says which models it
# serves over Anthropic messages or OpenAI responses instead.
#
#   name         What listings call it. Empty means the id.
#   base_url     The endpoint, up to and including the version (/v1). Required.
#   api_key_env  The environment variable holding the API key. Required. The
#                key itself never goes in this file.
#   models       Model ids to offer instead of asking the endpoint's /models:
#                for an endpoint without one, or to offer only these. Empty
#                means ask.
#
# A provider whose variable is not set is left out; nth needs at least one
# that is set. Go and Zen share OPENCODE_API_KEY.
#
# OpenCode Go (https://opencode.ai):
# [provider.opencode]
# name = "OpenCode Go"
# base_url = "https://opencode.ai/zen/go/v1"
# api_key_env = "OPENCODE_API_KEY"
# models = []
#
# OpenCode Zen (https://opencode.ai):
# [provider.zen]
# name = "OpenCode Zen"
# base_url = "https://opencode.ai/zen/v1"
# api_key_env = "OPENCODE_API_KEY"
# models = []
#
# Any other OpenAI-compatible endpoint, say:
# [provider.openrouter]
# name = "OpenRouter"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"

[session]
# Stop a turn after this many model requests without a final answer.
max_steps = 100

[task]
# A subagent the model starts with the task tool fails after this many
# model requests without an answer, or after this many seconds (0 for no
# time limit). The model hears why and can continue it by its task_id.
max_steps = 50
timeout_secs = 600

[work]
# A subagent the model puts on a work item with work_assign returns the
# item failed after this many model requests without an answer, or timed
# out after this many seconds (0 for no time limit). More than a task's: an
# item is a whole piece of work.
max_steps = 100
timeout_secs = 600
# A subagent on a work item that has said nothing (no reply, no tool call)
# for this many seconds is reported to the model as stalled, and left
# running (0 never reports one).
stall_secs = 120

[mode]
# The mode a new chat starts in: "plan" or "act". Tab switches between them.
# `nth run` starts in act; `nth run --mode plan` plans instead.
default = "plan"

# Profiles: what plan and act run with. A new chat starts on the first, and
# ctrl+p cycles through them in the chat; a profile whose provider has no
# key set is skipped. Each gives the model and effort for plan and act. An
# empty model means the one above. Effort is "default" (leave it to the
# model, for endpoints that reject the field), "none", "minimal", "low",
# "medium", "high", "xhigh" or "max"; a model is sent the nearest level it
# takes (`nth models` lists them). With no profiles at all, both modes run
# on the model above with the default effort.
#
#   name  What the prompt's label and the cycling hint call it. Required.
#
# [[profiles]]
# name = "opencode go"
#
# [profiles.plan]
# model = "opencode/deepseek-v4.1-flash"
# effort = "high"
#
# [profiles.act]
# model = "opencode/kimi-k3"
# effort = "default"
#
# [[profiles]]
# name = "zen"
#
# [profiles.plan]
# model = "zen/deepseek-v4.1-flash"
#
# [profiles.act]
# model = "zen/glm-5.3"

[chat]
# What the chat shows of what the model did. `/settings` toggles these for the
# run; these keys set where they start.
thinking = true
tool_output = true

[layout]
# From this many columns wide, the chat shows on the left and the other tabs
# on the right, once one is open. 0 never splits.
split_width = 160

[tools.read]
# Lines returned when the model gives no limit.
default_limit = 2000
# Longer lines are cut to this many characters.
max_line_chars = 2000
# Output stops before this many bytes.
max_bytes = 51200

[tools.bash]
# Timeout when the model gives none, in milliseconds.
default_timeout_ms = 120000
# Cap on the timeout the model may ask for, in milliseconds.
max_timeout_ms = 600000
# Longer output keeps only its last this-many characters.
max_output_chars = 30000
# Pass the model's commands through `rtk rewrite` (github.com/rtk-ai/rtk)
# when rtk is on PATH, to compress their output.
rtk = true

[tools.websearch]
# Exa's MCP endpoint. EXA_API_KEY, when set, is sent with each search.
url = "https://mcp.exa.ai/mcp"

[skills]
# Extra folders searched for SKILL.md files, after the standard ones.
# ~/ is the home directory; relative paths are from the working directory.
paths = []

[format]
# Run the file's formatters after a tool writes it. false turns them all off.
# `nth formatters` lists them and whether they apply to the working directory.
enabled = true

# One [format.<name>] table per formatter to change or add. A built-in name
# (rustfmt, prettier, ruff, gofmt, ...) changes that formatter; any other name
# adds one, which needs command and extensions.
#
#   disabled    true turns this formatter off.
#   command     Program and arguments; $FILE is the file to format. For a
#               built-in name, leaving it out keeps its own.
#   extensions  The files it formats, with the dot, as in ".toml". For a
#               built-in name, leaving it out keeps its own.
#   env         Extra environment variables for the command.
#
# [format.prettier]
# disabled = true
#
# [format.taplo]
# command = ["taplo", "format", "$FILE"]
# extensions = [".toml"]
# env = { RUST_LOG = "warn" }

[lsp]
# Start the file's language servers when a tool reads or writes it, and append
# the errors they report to the write result. false turns them all off.
# `nth lsp` lists them and the project root each would run in.
enabled = true

# One [lsp.<id>] table per server to change or add. A built-in id (rust,
# typescript, pyright, gopls, clangd, ...) changes that server; any other id
# adds one, which needs command and extensions. A server is only used when its
# program is on PATH.
#
#   disabled        true turns this server off.
#   command         Program and arguments. For a built-in id, empty keeps its
#                   own.
#   extensions      The files it checks, with the dot, as in ".rs". For a
#                   built-in id, empty keeps its own.
#   env             Extra environment variables for the server.
#   initialization  Sent to the server as initializationOptions.
#
# [lsp.pyright]
# disabled = true
#
# [lsp.rust]
# command = ["ra-multiplex"]
#
# [lsp.my-server]
# command = ["my-server", "--stdio"]
# extensions = [".foo"]
# env = { RUST_LOG = "info" }
# initialization = { someOption = true }

[notify]
# Desktop notifications when the model is done, fails, has a plan ready or
# asks you something. They are sent only while the terminal does not have
# focus (in tmux, `set -g focus-events on`). false turns them off.
# `nth notify` sends a sample.
enabled = true
# Where they go: "notify-send" (libnotify), the default on Linux, or
# "osascript" (Notification Center), the default on macOS.
# backend = "notify-send"
