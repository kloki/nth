[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kloki/nth"

[workspace.dependencies]
nth-context = { path = "crates/nth-context" }
nth-llm = { path = "crates/nth-llm" }
nth-protocol = { path = "crates/nth-protocol" }
nth-session = { path = "crates/nth-session" }
nth-tools = { path = "crates/nth-tools" }
nth-tui = { path = "crates/nth-tui" }
anyhow = "1"
braille-bar = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ignore = "0.4"
libc = "0.2"
nucleo-matcher = "0.3"
owo-colors = "4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "process", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
