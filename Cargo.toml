[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kloki/nth"

[workspace.dependencies]
nth-context = { path = "crates/nth-context" }
nth-format = { path = "crates/nth-format" }
nth-llm = { path = "crates/nth-llm" }
nth-lsp = { path = "crates/nth-lsp" }
nth-notify = { path = "crates/nth-notify" }
nth-protocol = { path = "crates/nth-protocol" }
nth-session = { path = "crates/nth-session" }
nth-tools = { path = "crates/nth-tools" }
nth-tui = { path = "crates/nth-tui" }
base64 = "0.22"
anyhow = "1"
braille-bar = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
fastrand = "2"
futures = "0.3"
hoodrich = "0.1.1"
htmd = "0.5"
ignore = "0.4"
jiff = "0.2"
libc = "0.2"
nucleo-matcher = "0.3"
owo-colors = "4"
regex = "1"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
similar = "3"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "fs",
  "process",
  "sync",
  "time",
] }
tokio-util = "0.7"
toml = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

# syntect (behind hoodrich) uses fancy-regex, which is very slow unoptimised;
# keep debug builds and tests responsive.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
